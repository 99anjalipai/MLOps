name: Periodic Model Calibration

on: 
  schedule:
    - cron: '0 0 * * *'  # runs daily at midnight UTC

jobs:
  calibration:
    runs-on: ubuntu-latest

    # Set working directory to your actual Lab 2 folder
    defaults:
      run:
        working-directory: Github_Labs/github_lab2/Lab2  # <-- adjust if folder spelling differs

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate and Store Timestamp
      id: timestamp
      run: |
        timestamp=$(date '+%Y%m%d%H%M%S')
        echo "$timestamp" > timestamp.txt
        echo "ts=$timestamp" >> $GITHUB_OUTPUT

    - name: Check File Permissions
      run: ls -l ./src/train_model.py

    - name: Retrain Model
      run: |
        timestamp=$(cat timestamp.txt)
        python ./src/train_model.py --timestamp "$timestamp"

    - name: Evaluate Model and Log Metrics
      run: |
        timestamp=$(cat timestamp.txt)
        python ./src/evaluate_model.py --timestamp "$timestamp"
      continue-on-error: false

    # NOTE:
    # train_model.py already saves models/ files
    # evaluate_model.py already writes metrics/<timestamp>_metrics.json
    # We only commit the folders — no moving/renaming needed.

    - name: Commit and Push Changes
      run: |
        git config --global user.email "26876927+raminmohammadi@users.noreply.github.com"
        git config --global user.name "raminmohammadi"

        git add models metrics || echo "Nothing to add"
        git commit -m "Periodic calibration run: updated model + metrics" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
