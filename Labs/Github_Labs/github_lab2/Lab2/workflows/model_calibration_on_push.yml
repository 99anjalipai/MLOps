name: Model Retraining on Push to Main

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the main branch

jobs:
  retrain:
    runs-on: ubuntu-latest

    # All "run:" commands will execute inside your lab folder
    defaults:
      run:
        working-directory: Github_Labs/github_lab2/Lab2   # <--- adjust if spelling differs

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Generate and Store Timestamp
      id: timestamp
      run: |
        timestamp=$(date '+%Y%m%d%H%M%S')
        echo "$timestamp" > timestamp.txt
        echo "ts=$timestamp" >> $GITHUB_OUTPUT

    - name: Check File Permissions
      run: ls -l ./src/train_model.py

    - name: Retrain Model
      run: |
        timestamp=$(cat timestamp.txt)
        python ./src/train_model.py --timestamp "$timestamp"

    - name: Evaluate Model and Log Metrics
      run: |
        timestamp=$(cat timestamp.txt)
        python ./src/evaluate_model.py --timestamp "$timestamp"
      continue-on-error: false

    # train_model.py already saves into models/, and evaluate_model.py
    # already writes metrics/<timestamp>_metrics.json.
    # We DO NOT mv anything; we just commit those folders.

    - name: Commit and Push Changes
      run: |
        git config --global user.email "26876927+raminmohammadi@users.noreply.github.com"
        git config --global user.name "raminmohammadi"

        git add models metrics || echo "Nothing to add"
        git commit -m "Add metrics and updated model (push retraining)" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
